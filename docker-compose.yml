services:
  orbit-sdlc:
    image: open-agents-sdlc:runtime
    build: .
    container_name: open-agents-sdlc
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      WORKSPACE_DIR: /workspace
      CODEX_HOME: /run/codex
    volumes:
      - open_agents_data:/data
      - "${WORKSPACE_PATH:-.}:/workspace"
    tmpfs:
      - /run/codex:mode=0700,uid=1000,gid=1000
    restart: unless-stopped
    init: true

volumes:
  open_agents_data:
